<!doctype html><html lang="en"><meta charset="utf-8"><title>Quest props review</title>
<style>body{margin:0;background:#e5e7eb;color:#243547;font:16px system-ui}header{padding:16px}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.158.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.158.0/examples/jsm/"}}</script>
<header>Quest props · real models, no floating cubes · <output id="status">Checking…</output></header>
<script type="module">
import * as THREE from 'three';
import {buildQuestItem,buildOpenStorage} from '../js/items.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe5e7eb);
const camera=new THREE.PerspectiveCamera(35,innerWidth/(innerHeight-56),0.1,100);camera.position.set(5,8,11);camera.lookAt(0,0.3,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight-56);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8d8277,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,8,5);scene.add(sun);
const data=[['pfanne',0x999999],['wurst',0xcc5544],['eier',0xfff0c0],['teller',0xfafafa],['besteck',0xdddddd],['socken',0xddcc44],['papier',0xffffff],['spielzeug',0xff8844],['gemuese',0x44aa44],['fleisch',0xcc4444],['brot',0xc8965a],['eis',0xffccdd]];
for(const [i,[name,color]] of data.entries()){
 const item=buildQuestItem(name,color);scene.add(item);
 const bounds=new THREE.Box3().setFromObject(item);
 if(bounds.isEmpty()||bounds.min.y < -0.002)throw Error(name+' penetrates support: '+bounds.min.y);
 item.position.set((i%4-1.5)*1.7,0.006,(Math.floor(i/4)-1)*1.7);
 const platform=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.06,1.3),new THREE.MeshStandardMaterial({color:0xc7b596}));platform.position.set(item.position.x,-0.03,item.position.z);scene.add(platform);
 const canvas=document.createElement('canvas');canvas.width=256;canvas.height=48;const ctx=canvas.getContext('2d');ctx.fillStyle='#243547';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText(name,128,30);
 const label=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(canvas)}));label.position.set(item.position.x,0.6,item.position.z);label.scale.set(1,0.2,1);scene.add(label);
}
for(const [i,[name,w,h,d,y,col]] of [['pfanne',1.6,1.8,0.7,1,0x8a5a3a],['wurst',1,2.2,0.8,1.2,0xeeeeee],['besteck',1.8,0.95,0.7,0.55,0x7a5a2a]].entries()){
 const storage=buildOpenStorage(w,h,d,col,y);storage.position.set((i-1)*2.2,0,-3.7);scene.add(storage);
 const item=buildQuestItem(name,0xbbbbbb);item.position.set(storage.position.x,y+0.006,-3.7);scene.add(item);
 const b=new THREE.Box3().setFromObject(item);
 storage.traverse(o=>{if(!o.isMesh)return;const p=new THREE.Box3().setFromObject(o);if(b.intersectsBox(p))throw Error(name+' intersects storage');});
}
document.querySelector('#status').textContent='12 models + 3 storage clearances passed';
renderer.render(scene,camera);
</script></html>
